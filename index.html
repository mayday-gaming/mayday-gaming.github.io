<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mayday Gaming</title>
<meta name="description" content="I giochi di Mayday Gaming: tutti giocabili nel browser, su computer e telefono.">
<meta property="og:title" content="Mayday Gaming">
<meta property="og:description" content="Giochi da browser fatti a mano: avventure ad acquerello, puzzle zen, platform e arcade.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ff8a5c'/><text x='16' y='22' font-size='16' text-anchor='middle' font-family='monospace' font-weight='700' fill='%23141210'>M</text></svg>">
<style>
  :root {
    --bg: #141210;
    --panel: #1d1a17;
    --line: #2e2924;
    --ink: #f3ece2;
    --muted: #a99d8f;
    --accent: #ff8a5c;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(255, 138, 92, .13), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(120, 140, 255, .08), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  header { padding: 72px 0 36px; }
  .kicker {
    font-family: var(--mono); font-size: 13px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--accent);
    display: flex; align-items: center; gap: 10px;
  }
  .kicker::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: blink 2.4s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  h1 { font-size: clamp(44px, 7vw, 84px); line-height: 1; margin: 18px 0 16px; letter-spacing: -.02em; font-weight: 700; }
  h1 em { font-style: italic; color: var(--accent); }
  .lede { max-width: 620px; color: var(--muted); font-size: 19px; margin: 0; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 36px 0 28px; }
  .chip {
    font-family: var(--mono); font-size: 13px; letter-spacing: .06em;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; transition: all .2s;
  }
  .chip:hover { color: var(--ink); border-color: #4a423a; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip .n { opacity: .55; margin-left: 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; padding-bottom: 80px; }

  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; transition: transform .25s ease, box-shadow .25s ease, border-color .25s;
  }
  .card:hover, .card:focus-within { transform: translateY(-4px); border-color: #4a423a; box-shadow: 0 18px 40px -18px rgba(0,0,0,.8), 0 0 0 1px rgba(255,138,92,.15); }
  .cover { aspect-ratio: 16 / 10; overflow: hidden; background: #000; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
  .card:hover .cover img { transform: scale(1.04); }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card h2 { font-size: 23px; margin: 0; line-height: 1.2; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a::after { content: ""; position: absolute; inset: 0; z-index: 1; } /* whole card clickable */
  .card h2 a:focus-visible { outline: none; }
  .card:has(h2 a:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card p { margin: 0; color: var(--muted); font-size: 16px; }
  .meta { margin-top: auto; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
  .code { position: relative; z-index: 2; font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px dashed #5a5047; white-space: nowrap; }
  .code:hover { color: var(--ink); border-color: var(--ink); }
  .play { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--accent); }
  .card.soon .play { color: var(--muted); }
  .card[hidden] { display: none; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 48px; color: var(--muted); font-family: var(--mono); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  footer a { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Mayday Gaming</div>
    <h1>Giochi da <em>browser</em>,<br>fatti a mano.</h1>
    <p class="lede">Avventure ad acquerello, puzzle per staccare la testa, platform e arcade. Grafica e musica sono scritte in codice, non serve installare niente: tocca un gioco e parte, su computer o telefono.</p>
  </header>

  <nav class="filters" aria-label="Filtra per genere" id="filters"></nav>

  <main class="grid" id="grid"></main>

  <footer>
    <span>© Mayday Gaming</span>
    <span>Codice su <a href="https://github.com/mayday-gaming">github.com/mayday-gaming</a></span>
  </footer>
</div>

<script>
  // Aggiungere un gioco: una riga qui sotto + covers/<slug>.svg (o .png).
  // play: null = non ancora giocabile online (la card porta al codice).
  const ORG = "https://github.com/mayday-gaming";
  const PAGES = "https://mayday-gaming.github.io";
  const GAMES = [
    { slug: "marginalia", title: "Marginalia", genre: "platform",
      desc: "Un platform narrativo in cui le piattaforme sono le righe dei libri. Postilla, una nota a matita, entra nelle storie per ripararle.",
      tags: ["platform", "narrativo"] },
    { slug: "brumafonda", title: "La Lanterna di Brumafonda", genre: "avventura",
      desc: "Action-adventure dall'alto alla Zelda, ad acquerello. Ilio e la lucciola Pip devono recuperare le tre Fiamme rubate.",
      tags: ["avventura", "acquerello"] },
    { slug: "pentimento", title: "Pentimento", genre: "avventura",
      desc: "Thriller sull'arte: sei una restauratrice romana che entra nei quadri per scoprire cosa ha nascosto il falsario.",
      tags: ["thriller", "go + ebitengine"] },
    { slug: "ottavio", title: "Er Gatto de Roma", genre: "avventura",
      desc: "Ottavio, gatto soriano di Largo Argentina, gira per la Roma antica, ricostruita in scala 1:1. Capitolo I: Colosseo e Fori.",
      tags: ["esplorazione", "acquerello"] },
    { slug: "bitforge", title: "Bitforge", genre: "crafting",
      desc: "Un gioco alla Forager sull'ingegneria informatica: dal silicio ai chip, fino alla CPU, per ricostruire il Kernel del mondo.",
      tags: ["crafting", "pixel art"] },
    { slug: "ladder-climbing", title: "Big Company — Ladder Climbing", genre: "platform",
      desc: "Platform arcade in ufficio: sette piani, sette boss e call improvvise, per salire dal 6° livello fino al Livello Super.",
      tags: ["arcade", "chiptune"] },
    { slug: "dolce-stil-novo", title: "Dolce Stil Novo", genre: "zen",
      desc: "Gioco tranquillo in prima persona sui dolci regionali d'Italia. A ogni ricetta impari qualcosa, senza timer e senza punteggi.",
      tags: ["zen", "cucina"] },
    { slug: "legami", title: "Legàmi", genre: "zen",
      desc: "Minigiochi rilassanti per il telefono, a livelli infiniti e casuali, per staccare a fine giornata.",
      tags: ["zen", "puzzle"] },
    { slug: "the-associations-garden", title: "The Associations Garden", genre: "zen",
      desc: "Solitario zen di associazioni tra parole, in italiano, con livelli infiniti generati da 45 categorie.",
      tags: ["zen", "parole"] },
    { slug: "chill-rider-3d", title: "Chill Rider 3D", genre: "zen", play: null,
      desc: "Bici al tramonto in un mondo low-poly, con la radio lo-fi accesa. Ancora da pubblicare online.",
      tags: ["zen", "three.js"] },
  ];
  const GENRES = [
    ["tutti", "Tutti"], ["avventura", "Avventura"], ["zen", "Zen"],
    ["platform", "Platform & arcade"], ["crafting", "Crafting"],
  ];

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const grid = document.getElementById("grid");
  grid.innerHTML = GAMES.map(g => {
    const repo = `${ORG}/${g.slug}`;
    const play = g.play === null ? null : (g.play || `${PAGES}/${g.slug}/`);
    return `
    <article class="card${play ? "" : " soon"}" data-genre="${g.genre}">
      <div class="cover"><img src="covers/${g.slug}.svg" alt="" loading="lazy" width="640" height="400"></div>
      <div class="body">
        <h2><a href="${play || repo}">${esc(g.title)}</a></h2>
        <p>${esc(g.desc)}</p>
        <div class="meta">
          <div class="tags">${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          ${play ? `<a class="code" href="${repo}">codice ↗</a>` : `<span class="play">presto online</span>`}
        </div>
      </div>
    </article>`;
  }).join("");

  const filters = document.getElementById("filters");
  filters.innerHTML = GENRES.map(([k, label]) => {
    const n = k === "tutti" ? GAMES.length : GAMES.filter(g => g.genre === k).length;
    return `<button class="chip" data-k="${k}" aria-pressed="${k === "tutti"}">${label}<span class="n">${n}</span></button>`;
  }).join("");
  filters.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filters.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    grid.querySelectorAll(".card").forEach(c => c.hidden = b.dataset.k !== "tutti" && c.dataset.genre !== b.dataset.k);
  });
</script>
</body>
</html>
